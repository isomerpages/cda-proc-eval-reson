title: Staging Site 3
url: https://www.relevance.com.sg
favicon: /images/favicon-isomer.ico
colors:
  primary-color: "#fa9955"
  secondary-color: "#9b9b9b"
  media-colors:
    - title: media-color-one
      color: "#d0021b"
    - title: media-color-two
      color: "#f8e71c"
    - title: media-color-three
      color: "#417505"
    - title: media-color-four
      color: "#4a90e2"
    - title: media-color-five
      color: "#50e3c2"
description: An Isomer site of the Singapore Government
permalink: none
baseurl: ""
exclude:
  - travis-script.js
  - .travis.yml
  - README.md
  - package.json
  - package-lock.json
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - Gemfile
  - Gemfile.lock
include:
  - _redirects
defaults:
  - scope:
      path: ""
    values:
      layout: page
custom_css_path: /misc/custom.css
custom_print_css_path: /assets/css/print.css
paginate: 12
remote_theme: isomerpages/isomerpages-template@next-gen
safe: false
plugins:
  - jekyll-feed
  - jekyll-assets
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme
staging: https://staging.d2jr4t9suwtbs8.amplifyapp.com
prod: https://master.deo2xw8oyf3q8.amplifyapp.com
facebook-pixel: ""
shareicon: /images/cda_logo.png
is_government: false
google_analytics_ga4: ""
linkedin-insights: ""
resources_name: news-and-events
